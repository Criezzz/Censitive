[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "censitive-privacy-gateway"
version = "0.0.1"
description = "Local Privacy Gateway thesis prototype"
readme = {text = "Run demo.cmd to start Censitive.", content-type = "text/plain"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/privacy_gateway"]
artifacts = ["backend/privacy_gateway/web/**", "backend/privacy_gateway/adapters/papillon_prompt.json", "backend/privacy_gateway/adapters/PAPILLON_LICENSE"]
