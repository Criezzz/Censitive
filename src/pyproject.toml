[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "censitive-privacy-gateway"
version = "0.0.1"
description = "Local Privacy Gateway thesis prototype"
readme = {text = "Local Privacy Gateway thesis prototype. Run uv sync --locked, then uv run --locked pytest.", content-type = "text/plain"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "anyio>=4,<5",
    "cryptography>=44,<47",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
    "mypy>=1.15,<2",
    "hatchling==1.27.0",
    "httpx>=0.27,<1",
    "hypothesis>=6,<7",
    "psutil>=7.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/privacy_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["PRIVACY_GATEWAY_THESIS_AGENT_HANDOFF_VI.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "tests", "tools"]
